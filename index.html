<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Sentence Builder — Nouns + Adverbs, Scrambled Words</title><meta name="theme-color" content="#0f766e"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sentence Builder"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon.png"><link rel="manifest" href="manifest.json"><style>body{font-family:system-ui,sans-serif;background:#f0fdfa;color:#134e4a;margin:0;padding:20px;text-align:center}h1{font-size:30px}.box{background:#fff;border-radius:24px;max-width:640px;margin:16px auto;padding:24px;box-shadow:0 12px 30px rgba(0,0,0,.12)}.built{min-height:56px;font-size:26px;font-weight:800;border:2px dashed #99f6e4;border-radius:14px;padding:12px}.tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:16px 0}button.tile{font-size:20px;padding:12px 16px;border:0;border-radius:12px;background:#ccfbf1;color:#134e4a;cursor:pointer}button{font-size:20px;padding:12px 20px;border:0;border-radius:14px;background:#0f766e;color:#fff;margin:6px;cursor:pointer}button.alt{background:#ccfbf1;color:#134e4a}.small{color:#115e59}#fb{font-size:22px;min-height:32px;font-weight:700}</style></head><body><h1>🧩 Sentence Builder</h1><p>Put the scrambled words in order! Every sentence has a <b>noun</b> and an <b>adverb</b>. Tap words to build it, then say it out loud!</p><div class="box"><div class="built" id="built">Tap words below…</div><div class="tiles" id="tiles"></div><div id="fb"></div></div><div><button onclick="check()">✅ Check my sentence</button><button class="alt" onclick="clearb()">Clear</button><button class="alt" onclick="hear()">🔊 Hear it</button><button class="alt" onclick="next()">Next ➜</button></div><p class="small" id="score"></p><p class="small">Example: dog / happily / runs / The → The dog runs happily. Save like an app: Safari → Share → Add to Home Screen.</p><script>const R=[["The dog runs happily", ["runs", "The", "dog", "happily"]], ["The girl sings loudly", ["The", "loudly", "sings", "girl"]], ["The boy reads quietly", ["boy", "The", "reads", "quietly"]], ["The cat sleeps peacefully", ["The", "peacefully", "cat", "sleeps"]], ["The bird flies quickly", ["flies", "bird", "quickly", "The"]], ["The baby laughs happily", ["baby", "The", "laughs", "happily"]], ["The teacher speaks clearly", ["The", "teacher", "clearly", "speaks"]], ["The boy walks slowly", ["slowly", "boy", "walks", "The"]], ["The girl dances gracefully", ["The", "gracefully", "girl", "dances"]], ["The dog barks loudly", ["dog", "barks", "The", "loudly"]], ["The cat jumps quickly", ["quickly", "cat", "The", "jumps"]], ["The boy eats carefully", ["boy", "carefully", "The", "eats"]], ["The girl swims happily", ["swims", "The", "girl", "happily"]], ["The bird sings sweetly", ["sweetly", "bird", "The", "sings"]], ["The baby sleeps soundly", ["baby", "soundly", "The", "sleeps"]], ["The girl writes neatly", ["writes", "neatly", "girl", "The"]], ["The boy runs quickly", ["boy", "quickly", "The", "runs"]], ["The dog plays happily", ["dog", "The", "plays", "happily"]], ["The cat walks quietly", ["cat", "quietly", "The", "walks"]], ["The girl talks softly", ["The", "girl", "softly", "talks"]]];let i=0,score=0,built=[];function render(){built=[];document.getElementById('built').textContent='Tap words below…';document.getElementById('fb').textContent='';let t=document.getElementById('tiles');t.innerHTML='';R[i][1].forEach(w=>{let b=document.createElement('button');b.className='tile';b.textContent=w;b.onclick=()=>{built.push(w);b.disabled=true;b.style.opacity='.4';document.getElementById('built').textContent=built.join(' ')}});document.getElementById('score').textContent='Score: '+score+' ⭐ | Sentence '+(i+1)+' of '+R.length}function check(){let s=built.join(' ');if(s===R[i][0]){score+=10;document.getElementById('fb').textContent='✅ Perfect! +10 points! Now say it: '+s}else{document.getElementById('fb').textContent='Try again — put the words in a different order.'}document.getElementById('score').textContent='Score: '+score+' ⭐ | Sentence '+(i+1)+' of '+R.length}function clearb(){render()}function hear(){try{speechSynthesis.speak(new SpeechSynthesisUtterance(R[i][0]))}catch(e){}}function next(){i=(i+1)%R.length;render()}render();</script></body></html>
